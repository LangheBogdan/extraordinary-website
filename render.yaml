services:
  - type: web
    name: extraordinary-website
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self' https://www.googletagmanager.com 'sha256-lpQko9erkyE7U43qlObViqhvNhGozGo0VLrNaW+N+Js='; style-src 'self' https://fonts.googleapis.com; img-src 'self' https://cdn.simpleicons.org https://www.googletagmanager.com; font-src https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self';"
